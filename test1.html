<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>菲菲的购物数学题 - Math Story</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&family=Nunito:wght@400;700&display=swap');

    :root {
      --bg-color: #FDFBF7;
      --rope-color: #FF9A9E;
      --ball-color: #FFC3A0;
      --ball-line: #FF6B6B;
      --text-color: #4A4E69;
      --highlight: #2A9D8F;
      --money-bg: #81B29A;
      --stage-width: 960px;
      --stage-height: 540px;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #222;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Nunito', 'Noto Sans SC', sans-serif;
      overflow: hidden;
    }

    /* 舞台容器 */
    #stage {
      width: var(--stage-width);
      height: var(--stage-height);
      background: var(--bg-color);
      position: relative;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
      border-radius: 12px;
    }

    /* 背景装饰 */
    .bg-decoration {
      position: absolute;
      border-radius: 50%;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      opacity: 0.3;
      z-index: 0;
    }

    .circle-1 {
      width: 300px;
      height: 300px;
      top: -50px;
      left: -50px;
    }

    .circle-2 {
      width: 400px;
      height: 400px;
      bottom: -100px;
      right: -100px;
    }

    /* 通用物体样式 */
    .object {
      position: absolute;
      transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
      opacity: 0;
      transform: scale(0);
      z-index: 10;
    }

    .object.visible {
      opacity: 1;
      transform: scale(1);
    }

    /* 篮球 */
    .basketball {
      width: 80px;
      height: 80px;
      background: var(--ball-color);
      border-radius: 50%;
      box-shadow: inset -5px -5px 10px rgba(0, 0, 0, 0.1), 0 10px 15px rgba(0, 0, 0, 0.1);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .basketball::before,
    .basketball::after {
      content: '';
      position: absolute;
      border: 2px solid var(--ball-line);
      border-radius: 50%;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
    }

    .basketball::before {
      width: 100%;
      border: none;
      border-bottom: 2px solid var(--ball-line);
      transform: rotate(-45deg);
    }

    .basketball::after {
      width: 60%;
      height: 100%;
      border: 2px solid var(--ball-line);
      border-top: none;
      border-bottom: none;
    }

    /* 跳绳 */
    .rope {
      width: 60px;
      height: 80px;
    }

    .rope svg {
      width: 100%;
      height: 100%;
      fill: none;
      stroke: var(--rope-color);
      stroke-width: 4;
      stroke-linecap: round;
      filter: drop-shadow(0 5px 5px rgba(0, 0, 0, 0.1));
    }

    /* 钱币 */
    .money-bill {
      width: 100px;
      height: 50px;
      background: var(--money-bg);
      color: white;
      border-radius: 4px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 18px;
      border: 2px dashed rgba(255, 255, 255, 0.5);
      box-shadow: 0 5px 10px rgba(0, 0, 0, 0.1);
    }

    /* 文字和标签 */
    .label {
      font-size: 24px;
      color: var(--text-color);
      font-weight: bold;
      position: absolute;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .label.show {
      opacity: 1;
    }

    /* 算式区域 */
    .equation-area {
      position: absolute;
      top: 150px;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      z-index: 5;
    }

    /* 字幕条 */
    .subtitle-container {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 120px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border-top: 1px solid rgba(0, 0, 0, 0.05);
      z-index: 100;
      padding: 0 40px;
      box-sizing: border-box;
      transition: transform 0.5s ease;
    }

    .subtitle-zh {
      font-size: 22px;
      color: #333;
      font-weight: 700;
      margin-bottom: 8px;
      text-align: center;
    }

    .subtitle-en {
      font-size: 16px;
      color: #666;
      font-style: italic;
      text-align: center;
    }

    /* 动画特效 */
    @keyframes popIn {
      0% {
        transform: scale(0);
        opacity: 0;
      }

      60% {
        transform: scale(1.1);
        opacity: 1;
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-10px);
      }
    }

    .floating {
      animation: float 3s ease-in-out infinite;
    }

    @keyframes morphFlash {
      0% {
        filter: brightness(1);
        transform: scale(1);
      }

      50% {
        filter: brightness(2);
        transform: scale(1.2);
      }

      100% {
        filter: brightness(1);
        transform: scale(1);
      }
    }

    .flash-effect {
      animation: morphFlash 0.5s ease-out;
    }

    /* 进度条 */
    .progress-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 4px;
      background: var(--highlight);
      width: 0%;
      z-index: 101;
      transition: width 0.2s linear;
    }

    /* 总结卡片 */
    .summary-card {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.9);
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: all 1s ease;
      z-index: 200;
    }

    .summary-card.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .summary-item {
      display: flex;
      align-items: center;
      gap: 15px;
      margin: 20px 0;
      font-size: 24px;
      color: var(--text-color);
    }
  </style>
</head>

<body>

  <div id="stage">
    <!-- 背景元素 -->
    <div class="bg-decoration circle-1"></div>
    <div class="bg-decoration circle-2"></div>

    <!-- 动态生成的元素容器 -->
    <div id="elements-layer"></div>

    <!-- 标签层 -->
    <div id="labels-layer"></div>

    <!-- 字幕 -->
    <div class="subtitle-container">
      <div class="subtitle-zh" id="sub-zh">准备开始...</div>
      <div class="subtitle-en" id="sub-en">Ready to start...</div>
    </div>

    <!-- 进度条 -->
    <div class="progress-bar" id="progress"></div>

    <!-- 总结卡片 -->
    <div class="summary-card" id="summary">
      <h2 style="color: var(--highlight);">最终答案 / Final Answer</h2>
      <div class="summary-item">
        <div class="rope" style="transform: scale(0.6); position:relative;"><svg viewBox="0 0 50 80">
            <path d="M10,10 C10,60 40,60 40,10" fill="none" stroke="#FF9A9E" stroke-width="5" stroke-linecap="round" />
            <circle cx="10" cy="10" r="4" fill="#FF9A9E" />
            <circle cx="40" cy="10" r="4" fill="#FF9A9E" />
          </svg></div>
        <span>= 7 元 (Yuan)</span>
      </div>
      <div class="summary-item">
        <div class="basketball" style="transform: scale(0.6); position:relative;"></div>
        <span>= 35 元 (Yuan)</span>
      </div>
    </div>
  </div>

  <script>
    // 工具函数：创建SVG跳绳
    function createRopeSVG() {
      return `<svg viewBox="0 0 50 80">
                <path d="M10,10 C10,60 40,60 40,10" />
                <circle cx="10" cy="10" r="4" fill="currentColor"/>
                <circle cx="40" cy="10" r="4" fill="currentColor"/>
            </svg>`;
    }

    // 状态管理
    const state = {
      ropes: [],
      ball: null,
      money: null,
      totalText: null
    };

    const stage = document.getElementById('elements-layer');
    const labelsLayer = document.getElementById('labels-layer');
    const subZh = document.getElementById('sub-zh');
    const subEn = document.getElementById('sub-en');
    const progressBar = document.getElementById('progress');

    // 简单的延时函数
    const wait = (ms) => new Promise(resolve => setTimeout(resolve, ms));

    // 创建元素函数
    function createElement(type, x, y, content = '') {
      const el = document.createElement('div');
      el.className = `object ${type}`;
      el.style.left = x + 'px';
      el.style.top = y + 'px';

      if (type === 'rope') {
        el.innerHTML = createRopeSVG();
      } else if (type === 'money-bill') {
        el.innerText = content;
      } else {
        el.innerHTML = content;
      }

      stage.appendChild(el);
      // 强制重绘以触发transition
      el.offsetHeight;
      return el;
    }

    function createLabel(text, x, y, size = '24px', color = 'var(--text-color)') {
      const el = document.createElement('div');
      el.className = 'label';
      el.innerText = text;
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      el.style.fontSize = size;
      el.style.color = color;
      labelsLayer.appendChild(el);
      return el;
    }

    // 字幕更新
    function setSubtitle(zh, en) {
      subZh.style.opacity = 0;
      subEn.style.opacity = 0;
      setTimeout(() => {
        subZh.innerText = zh;
        subEn.innerText = en;
        subZh.style.opacity = 1;
        subEn.style.opacity = 1;
      }, 300);
    }

    // 播放进度条
    let startTime = null;
    const totalDuration = 28000; // 约28秒
    function updateProgress(timestamp) {
      if (!startTime) startTime = timestamp;
      const elapsed = timestamp - startTime;
      const percent = Math.min((elapsed / totalDuration) * 100, 100);
      progressBar.style.width = percent + '%';
      if (elapsed < totalDuration) {
        requestAnimationFrame(updateProgress);
      }
    }

    // 主时间轴逻辑
    async function startAnimation() {
      requestAnimationFrame(updateProgress);

      // Scene 1: Intro & Cost Calculation
      setSubtitle("菲菲在商店买了 2 根跳绳和 1 个篮球。", "Feifei bought 2 jump ropes and 1 basketball.");

      await wait(1000);

      // 展示物品：2绳 1球
      const rope1 = createElement('rope', 200, 200);
      rope1.classList.add('visible', 'floating');
      await wait(500);
      const rope2 = createElement('rope', 280, 200);
      rope2.classList.add('visible', 'floating');
      await wait(500);
      const plusSign1 = createLabel('+', 350, 225, '40px');
      plusSign1.classList.add('show');

      const ball = createElement('basketball', 400, 200);
      ball.classList.add('visible', 'floating');
      state.ball = ball;

      await wait(2500);

      // 算钱
      setSubtitle("她付了 50 元，售货员找给她 1 元。", "She paid 50 Yuan, and got 1 Yuan change.");

      const bill50 = createElement('money-bill', 600, 150, '¥50');
      bill50.classList.add('visible');

      await wait(1500);

      const arrow = createLabel('➡', 640, 210, '30px');
      arrow.classList.add('show');

      const bill1 = createElement('money-bill', 600, 250, '找零 ¥1');
      bill1.style.background = '#e76f51'; // Change color for change
      bill1.classList.add('visible');

      await wait(2000);

      setSubtitle("所以，这些东西一共花了 49 元。", "So, the total cost is 49 Yuan.");

      // 移除钱，显示总价
      bill50.style.opacity = 0;
      bill1.style.opacity = 0;
      arrow.style.opacity = 0;
      await wait(500);

      const equalsSign = createLabel('=', 520, 225, '40px');
      equalsSign.classList.add('show');

      const totalCost = createLabel('49 元', 580, 220, '50px', 'var(--highlight)');
      totalCost.classList.add('show');

      await wait(3000);

      // Scene 2: The Substitution Clue
      setSubtitle("已知：买 1 个篮球的钱正好可以买 5 根跳绳。", "Clue: 1 basketball costs the same as 5 jump ropes.");

      // 高亮篮球
      ball.style.transform = 'scale(1.2)';
      ball.style.boxShadow = '0 0 30px var(--ball-color)';

      await wait(3000);

      setSubtitle("如果把篮球换成跳绳，会发生什么呢？", "What if we replace the basketball with ropes?");

      await wait(1500);

      // 替换动画
      ball.classList.add('flash-effect'); // 闪光
      await wait(250);
      ball.style.opacity = 0; // 消失

      // 生成5根绳子在篮球的位置
      const newRopes = [];
      const startX = 400;
      for (let i = 0; i < 5; i++) {
        const r = createElement('rope', 400, 200); // 初始都在篮球位置
        r.classList.add('visible');
        newRopes.push(r);
      }

      await wait(500);

      // 展开这5根绳子
      setSubtitle("看！1 个篮球变成了 5 根跳绳。", "Look! 1 basketball turns into 5 jump ropes.");

      // 重新排列所有绳子 (2 原有 + 5 新增)
      // 目标位置：从左到右排列
      // 原有绳子移动
      rope1.style.left = '100px';
      rope2.style.left = '180px';

      // 新绳子展开
      newRopes.forEach((r, index) => {
        r.style.left = (300 + index * 80) + 'px';
        // 加一点颜色区分，表示是变出来的
        r.querySelector('svg').style.stroke = '#FFB703';
      });

      // 调整符号位置
      plusSign1.style.left = '250px';
      plusSign1.style.opacity = 1; // 确保显示

      // 添加一个虚线框表示这是原来的篮球
      const groupLabel = createLabel('原来的篮球 (Basketball)', 460, 150, '14px', '#888');
      groupLabel.classList.add('show');

      await wait(4000);

      // Scene 3: Calculation
      setSubtitle("现在一共有 2 + 5 = 7 根跳绳。", "Now we have 2 + 5 = 7 ropes in total.");

      // 高亮所有绳子
      const allRopes = [rope1, rope2, ...newRopes];
      allRopes.forEach(r => r.style.transform = 'scale(1.1)');

      await wait(3000);

      setSubtitle("49 元买 7 根跳绳，每根多少钱？", "49 Yuan for 7 ropes. How much is one?");

      // 显示除法算式
      const mathStep1 = createLabel('49 ÷ 7 = 7 元', 350, 350, '40px', 'var(--rope-color)');
      mathStep1.classList.add('show');

      await wait(3000);

      setSubtitle("所以，1 根跳绳是 7 元。", "So, 1 jump rope is 7 Yuan.");

      // 在绳子下面显示价格
      rope1.innerHTML += `<div style="position:absolute; bottom:-25px; width:100%; text-align:center; font-weight:bold; color:var(--rope-color)">¥7</div>`;

      await wait(3000);

      // Scene 4: Basketball Price
      setSubtitle("那篮球呢？篮球等于 5 根跳绳。", "What about the basketball? It equals 5 ropes.");

      // 淡出除法算式，淡出前两根绳子
      mathStep1.style.opacity = 0;
      rope1.style.opacity = 0.2;
      rope2.style.opacity = 0.2;
      plusSign1.style.opacity = 0;

      // 聚焦那5根绳子
      newRopes.forEach(r => {
        r.style.transform = 'scale(1.2)';
        r.querySelector('svg').style.stroke = '#FF9A9E'; // 变回粉色
      });

      await wait(2000);

      setSubtitle("5 乘 7 等于 35 元。", "5 times 7 equals 35 Yuan.");

      const mathStep2 = createLabel('5 × 7 = 35 元', 400, 350, '40px', 'var(--ball-color)');
      mathStep2.classList.add('show');
      mathStep2.style.color = '#d97706'; // 深橙色

      await wait(3000);

      setSubtitle("所以，1 个篮球是 35 元。", "So, 1 basketball is 35 Yuan.");

      // 5根绳子变回篮球
      newRopes.forEach(r => r.style.opacity = 0);
      groupLabel.style.opacity = 0;

      await wait(500);

      // 重新显示一个大篮球
      const finalBall = createElement('basketball', 440, 200);
      finalBall.classList.add('visible', 'floating');
      finalBall.style.transform = 'scale(1.5)';
      finalBall.innerHTML = '<div style="color:white; font-weight:bold; font-size:20px; text-shadow:1px 1px 2px rgba(0,0,0,0.5)">¥35</div>';

      await wait(3000);

      // Outro
      setSubtitle("问题解决！", "Problem Solved!");
      document.getElementById('summary').classList.add('show');
    }

    // 启动
    window.onload = () => {
      setTimeout(startAnimation, 500);
    };

  </script>
</body>

</html>
