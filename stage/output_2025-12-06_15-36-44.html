<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>纽扣和香包</title>
    <style>
        :root {
            --bg-color: #f0f4ff;
            --accent-color-button: #ff8c94;
            --accent-color-sachet: #82c0cc;
            --highlight-color: #f7b733;
            --dimmed-color: #d1d1d1;
            --container-bg: #ffffff;
            --text-color: #333333;
            --subtitle-bg: rgba(0, 0, 0, 0.6);
            --subtitle-text: #ffffff;
        }
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-color);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Microsoft Yahei", "Noto Sans SC", sans-serif;
        }
        #cinema-container {
            width: 90vw;
            max-width: 800px;
            aspect-ratio: 16 / 9;
            background-color: var(--container-bg);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
        }
        #canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        .overlay-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            padding: 2.5%;
            box-sizing: border-box;
        }
        .header {
            position: absolute;
            top: 4%;
            left: 5%;
            opacity: 0;
            transform: translateY(-20px);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }
        .header.visible {
            opacity: 1;
            transform: translateY(0);
        }
        .title {
            font-size: 1.8rem;
            color: var(--text-color);
            margin: 0;
        }
        .subtitle-topic {
            font-size: 1.1rem;
            color: #666;
            margin: 0;
        }
        .subtitle-box {
            position: absolute;
            bottom: 6%;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--subtitle-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: var(--subtitle-text);
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 1.4rem;
            letter-spacing: 1.5px;
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .subtitle-box.visible {
            opacity: 1;
        }
        .subtitle-box.pop {
            transform: translateX(-50%) scale(1.05);
        }
        .math-card {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            text-align: center;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .math-card.visible {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
        .math-text {
            font-size: 2rem;
            font-weight: bold;
            color: var(--text-color);
        }
        .math-sub {
            font-size: 1rem;
            color: #555;
            margin-top: 5px;
        }
        .progress-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background-color: rgba(0, 0, 0, 0.1);
        }
        .progress-bar {
            width: 0%;
            height: 100%;
            background-color: var(--highlight-color);
            transition: width 0.1s linear;
        }
    </style>
</head>
<body>

    <div id="cinema-container">
        <canvas id="canvas"></canvas>
        <div class="overlay-layer">
            <div class="header" id="header">
                <h1 class="title">纽扣和香包</h1>
                <span class="subtitle-topic">10颗纽扣能做几个香包？</span>
            </div>
            <div class="math-card" id="mathCard">
                <div class="math-text" id="mathContent"></div>
                <div class="math-sub" id="mathLabel"></div>
            </div>
            <div class="subtitle-box" id="subtitleBox">
                <span class="subtitle-cn" id="subCN"></span>
            </div>
        </div>
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
    </div>

    <script>
        // --- DOM Elements ---
        const container = document.getElementById('cinema-container');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const header = document.getElementById('header');
        const subtitleBox = document.getElementById('subtitleBox');
        const subCN = document.getElementById('subCN');
        const mathCard = document.getElementById('mathCard');
        const mathContent = document.getElementById('mathContent');
        const mathLabel = document.getElementById('mathLabel');
        const progressBar = document.getElementById('progressBar');

        // --- Colors ---
        const COLORS = {
            BUTTON: '#ff8c94',
            SACHET: '#82c0cc',
            HIGHLIGHT_STROKE: '#f7b733',
            DIMMED: '#d1d1d1',
            TEXT: '#333333'
        };

        // --- Canvas & Layout Globals ---
        let viewWidth, viewHeight, dpr;
        let buttons = [];
        let sachets = [];
        let highlightCircles = [];

        // --- Animation State ---
        let startTime = null;
        let currentStepIndex = -1;
        const script = [
            { t: 500, cn: "小美有10颗漂亮的纽扣，她想用它们来做香包。", action: 'intro' },
            { t: 4000, cn: "每个香包需要缝上2颗纽扣。", action: 'show_rule' },
            { t: 6500, cn: "我们来分组看看。先拿出2颗纽扣，做第1个香包。", action: 'group_1' },
            { t: 9500, cn: "再拿出2颗纽扣，做第2个香包。", action: 'group_2' },
            { t: 12500, cn: "接着，拿出2颗纽扣，做第3个香包。", action: 'group_3' },
            { t: 15500, cn: "我们继续，再拿出2颗，做第4个香包。", action: 'group_4' },
            { t: 18500, cn: "最后，再拿出2颗，做第5个香包。", action: 'group_5' },
            { t: 21500, cn: "现在，所有的纽扣都分完组了。", action: 'all_grouped' },
            { t: 23500, cn: "10颗纽扣，每2颗一组，正好可以分成5组。", action: 'show_division_equation' },
            { t: 27000, cn: "所以，小美最多能做5个香包。", action: 'show_sachet_result' },
            { t: 30000, cn: "因为纽扣正好用完，所以没有剩余。", action: 'show_remainder_result' },
            { t: 33000, cn: "问题解决了！", action: 'end' }
        ];
        const totalDuration = script[script.length - 1].t + 2000;

        // --- Graphics Classes ---
        class Button {
            constructor(x, y, radius, color) {
                this.x = x; this.y = y; this.radius = radius; this.color = color;
                this.targetX = x; this.targetY = y;
                this.opacity = 0; this.targetOpacity = 1;
                this.scale = 0; this.targetScale = 1;
                this.isDimmed = false;
            }
            update(dt) {
                const lerpFactor = 1 - Math.pow(0.01, dt);
                this.x += (this.targetX - this.x) * lerpFactor;
                this.y += (this.targetY - this.y) * lerpFactor;
                this.opacity += (this.targetOpacity - this.opacity) * lerpFactor;
                this.scale += (this.targetScale - this.scale) * lerpFactor;
            }
            draw(ctx) {
                if (this.opacity <= 0.01) return;
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.scale(this.scale, this.scale);
                ctx.globalAlpha = this.opacity * (this.isDimmed ? 0.3 : 1);
                
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fill();
                
                // button holes
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                const holeDist = this.radius * 0.3;
                ctx.beginPath();
                ctx.arc(-holeDist, -holeDist, this.radius * 0.1, 0, Math.PI * 2);
                ctx.arc(holeDist, -holeDist, this.radius * 0.1, 0, Math.PI * 2);
                ctx.arc(-holeDist, holeDist, this.radius * 0.1, 0, Math.PI * 2);
                ctx.arc(holeDist, holeDist, this.radius * 0.1, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        }
        
        class Sachet {
            constructor(x, y, size, color) {
                this.x = x; this.y = y; this.size = size; this.color = color;
                this.opacity = 0; this.targetOpacity = 1;
                this.scale = 0; this.targetScale = 1;
            }
            update(dt) {
                const lerpFactor = 1 - Math.pow(0.01, dt);
                this.opacity += (this.targetOpacity - this.opacity) * lerpFactor;
                this.scale += (this.targetScale - this.scale) * lerpFactor;
            }
            draw(ctx) {
                if (this.opacity <= 0.01) return;
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.scale(this.scale, this.scale);
                ctx.globalAlpha = this.opacity;

                const s = this.size;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.moveTo(-s/2, -s/2);
                ctx.quadraticCurveTo(0, -s*0.8, s/2, -s/2);
                ctx.lineTo(s/2, s/2);
                ctx.quadraticCurveTo(0, s*0.2, -s/2, s/2);
                ctx.closePath();
                ctx.fill();
                
                // decoration
                ctx.fillStyle = 'rgba(255,255,255,0.5)';
                ctx.font = `${s*0.8}px serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('福', 0, s*0.1);

                ctx.restore();
            }
        }

        class HighlightCircle {
            constructor(x, y, radius) {
                this.x = x; this.y = y; this.radius = radius;
                this.opacity = 0; this.targetOpacity = 0;
                this.scale = 0.8; this.targetScale = 1;
                this.lineWidth = 4;
            }
            update(dt) {
                const lerpFactor = 1 - Math.pow(0.01, dt);
                this.opacity += (this.targetOpacity - this.opacity) * lerpFactor;
                this.scale += (this.targetScale - this.scale) * lerpFactor;
            }
            draw(ctx) {
                if (this.opacity <= 0.01) return;
                ctx.save();
                ctx.globalAlpha = this.opacity;
                ctx.strokeStyle = COLORS.HIGHLIGHT_STROKE;
                ctx.lineWidth = this.lineWidth;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius * this.scale, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
            }
            flash(x, y, radius) {
                this.x = x;
                this.y = y;
                this.radius = radius;
                this.opacity = 1;
                this.targetOpacity = 0;
                this.scale = 0.8;
                this.targetScale = 1.2;
            }
        }

        // --- Setup & Main Loop ---
        function setup() {
            resizeCanvas();

            // Create initial buttons
            const numButtons = 10;
            const cols = 5;
            const rows = 2;
            const paddingX = viewWidth * 0.15;
            const paddingY = viewHeight * 0.2;
            const gridW = viewWidth - 2 * paddingX;
            const gridH = viewHeight - 2 * paddingY;
            const spacingX = gridW / (cols - 1);
            const spacingY = gridH / (rows - 1);
            const radius = Math.min(spacingX, spacingY) * 0.3;

            const startX = paddingX;
            const startY = paddingY;

            for (let i = 0; i < numButtons; i++) {
                const r = Math.floor(i / cols);
                const c = i % cols;
                const x = startX + c * spacingX;
                const y = startY + r * spacingY;
                const btn = new Button(x, y, radius, COLORS.BUTTON);
                btn.targetOpacity = 0; // Initially hidden
                buttons.push(btn);
            }
            
            const numSachets = 5;
            const sachetSize = radius * 2.5;
            const sachetTotalWidth = numSachets * sachetSize * 1.5;
            const sachetStartX = viewWidth / 2 - sachetTotalWidth / 2;
            const sachetY = viewHeight * 0.8;

            for (let i = 0; i < numSachets; i++) {
                const x = sachetStartX + i * sachetSize * 1.5;
                const sch = new Sachet(x, sachetY, sachetSize, COLORS.SACHET);
                sachets.push(sch);
            }
            
            for (let i = 0; i < numSachets; i++) {
                highlightCircles.push(new HighlightCircle(0, 0, 0));
            }
            
            window.addEventListener('resize', resizeCanvas);
            requestAnimationFrame(loop);
        }

        function resizeCanvas() {
            dpr = window.devicePixelRatio || 1;
            const rect = container.getBoundingClientRect();
            viewWidth = rect.width;
            viewHeight = rect.height;
            canvas.width = viewWidth * dpr;
            canvas.height = viewHeight * dpr;
            canvas.style.width = viewWidth + 'px';
            canvas.style.height = viewHeight + 'px';
            ctx.setTransform(1, 0, 0, 1, 0, 0); // Reset transform
            ctx.scale(dpr, dpr); // Scale once
        }

        let lastTime = 0;
        function loop(timestamp) {
            if (!startTime) {
                startTime = timestamp;
                lastTime = timestamp;
            }
            const elapsed = timestamp - startTime;
            const dt = (timestamp - lastTime) / 1000; // delta time in seconds
            lastTime = timestamp;

            // --- Update Step ---
            const nextStepIndex = script.findIndex(step => step.t > elapsed);
            const newStepIndex = (nextStepIndex === -1 ? script.length : nextStepIndex) -1;

            if (newStepIndex > currentStepIndex) {
                for (let i = currentStepIndex + 1; i <= newStepIndex; i++) {
                    const step = script[i];
                    subCN.textContent = step.cn;
                    subtitleBox.classList.add('visible');
                    subtitleBox.classList.remove('pop');
                    void subtitleBox.offsetWidth; // Trigger reflow
                    subtitleBox.classList.add('pop');
                    speakText(step.cn);
                    executeAction(step.action);
                }
                currentStepIndex = newStepIndex;
            }

            // --- Update Entities ---
            [...buttons, ...sachets, ...highlightCircles].forEach(obj => obj.update(dt));

            // --- Draw Step ---
            ctx.clearRect(0, 0, viewWidth, viewHeight);

            sachets.forEach(s => s.draw(ctx));
            buttons.forEach(b => b.draw(ctx));
            highlightCircles.forEach(h => h.draw(ctx));

            // --- Progress Bar ---
            progressBar.style.width = `${(elapsed / totalDuration) * 100}%`;

            if (elapsed < totalDuration) {
                requestAnimationFrame(loop);
            }
        }
        
        function executeAction(action) {
            // Hide math card by default
            mathCard.classList.remove('visible');

            if (action === 'intro') {
                header.classList.add('visible');
                buttons.forEach((btn, i) => {
                    setTimeout(() => {
                        btn.targetOpacity = 1;
                        btn.targetScale = 1;
                    }, i * 50);
                });
            }
            
            if (action === 'show_rule') {
                // Just subtitle
            }

            if (action.startsWith('group_')) {
                const groupIndex = parseInt(action.split('_')[1]) - 1;
                const btn1 = buttons[groupIndex * 2];
                const btn2 = buttons[groupIndex * 2 + 1];
                const sachet = sachets[groupIndex];
                
                // Highlight the pair
                btn1.isDimmed = false;
                btn2.isDimmed = false;
                const midX = (btn1.x + btn2.x) / 2;
                const midY = (btn1.y + btn2.y) / 2;
                const radius = Math.hypot(btn1.x - midX, btn1.y - midY) + btn1.radius;
                highlightCircles[groupIndex].flash(midX, midY, radius);

                // Dim other ungrouped buttons
                buttons.forEach((b, i) => {
                    if(i > groupIndex * 2 + 1) b.isDimmed = true;
                });
                
                // Show the corresponding sachet
                sachet.targetOpacity = 1;
                sachet.targetScale = 1;
            }

            if (action === 'all_grouped') {
                buttons.forEach(b => b.isDimmed = false);
            }
            
            if (action === 'show_division_equation') {
                mathContent.innerHTML = '10 ÷ 2 = 5';
                mathLabel.textContent = '10颗纽扣，每2颗一组，共5组';
                mathCard.classList.add('visible');
            }

            if (action === 'show_sachet_result') {
                mathContent.innerHTML = '5 个香包';
                mathLabel.textContent = '最多能制作的数量';
                mathCard.classList.add('visible');
            }
            
            if (action === 'show_remainder_result') {
                 mathContent.innerHTML = '剩余 0 颗';
                 mathLabel.textContent = '纽扣正好用完，没有剩余';
                 mathCard.classList.add('visible');
            }
        }
        
        // --- Speech Synthesis ---
        function speakText(text) {
            if (typeof window === 'undefined' || !('speechSynthesis' in window)) return;
            const synth = window.speechSynthesis;
            synth.cancel();
            if (!text || !text.trim()) return;
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'zh-CN';
            utter.rate = 1.0;
            utter.pitch = 1.0;
            synth.speak(utter);
        }

        // --- Start ---
        setup();
    </script>
</body>
</html>
