<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fogsight · 买门票</title>
    <style>
        :root {
            --bg-color: #f0f4ff;
            --container-bg: #ffffff;
            --text-primary: #1a1a1a;
            --text-secondary: #555;
            --accent-color-1: #ff8c82; /* Pink */
            --accent-color-2: #ffd761; /* Yellow */
            --shadow-color: rgba(0, 0, 0, 0.1);
            --subtitle-bg: rgba(20, 20, 20, 0.8);
            --subtitle-text: #ffffff;
            --progress-bar-color: #ff8c82;
        }
        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Microsoft Yahei", "Noto Sans SC", sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #cinema-container {
            width: 100%;
            max-width: 880px;
            aspect-ratio: 16 / 9;
            background-color: var(--container-bg);
            border-radius: 20px;
            box-shadow: 0 10px 30px var(--shadow-color);
            position: relative;
            overflow: hidden;
        }
        #canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        .overlay-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            width: 100%;
            text-align: center;
            padding: 24px 0;
            opacity: 0;
            transform: translateY(-20px);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }
        .header.visible {
            opacity: 1;
            transform: translateY(0);
        }
        .title {
            font-size: 24px;
            color: var(--text-primary);
            margin: 0;
        }
        .subtitle-topic {
            font-size: 16px;
            color: var(--text-secondary);
        }
        .math-card {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 16px 24px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            opacity: 0;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s ease;
            text-align: center;
            pointer-events: all;
            min-width: 200px;
        }
        .math-card.visible {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
        .math-text {
            font-size: 28px;
            font-weight: bold;
            color: var(--text-primary);
            white-space: nowrap;
        }
        .math-sub {
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 4px;
        }
        .subtitle-box {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) scale(0.95);
            max-width: 90%;
            background-color: var(--subtitle-bg);
            backdrop-filter: blur(8px);
            border-radius: 12px;
            padding: 12px 20px;
            opacity: 0;
            transition: all 0.3s ease-out;
        }
        .subtitle-box.visible {
            opacity: 1;
            transform: translateX(-50%) scale(1);
        }
        .subtitle-cn {
            font-size: 20px;
            color: var(--subtitle-text);
            letter-spacing: 1px;
            text-align: center;
        }
        .progress-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background-color: rgba(0,0,0,0.1);
        }
        .progress-bar {
            width: 0%;
            height: 100%;
            background-color: var(--progress-bar-color);
            transition: width 0.1s linear;
        }
    </style>
</head>
<body>
    <div id="cinema-container">
        <canvas id="canvas"></canvas>
        <div class="overlay-layer">
            <div class="header" id="header">
                <h1 class="title">买门票要花多少钱？</h1>
                <span class="subtitle-topic">计算一家三口公园门票的总费用</span>
            </div>
            <div class="math-card" id="mathCard">
                <div class="math-text" id="mathContent"></div>
                <div class="math-sub" id="mathLabel"></div>
            </div>
            <div class="subtitle-box" id="subtitleBox">
                <span class="subtitle-cn" id="subCN"></span>
            </div>
        </div>
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const header = document.getElementById('header');
        const subtitleBox = document.getElementById('subtitleBox');
        const subCN = document.getElementById('subCN');
        const mathCard = document.getElementById('mathCard');
        const mathContent = document.getElementById('mathContent');
        const mathLabel = document.getElementById('mathLabel');
        const progressBar = document.getElementById('progressBar');
        const cinemaContainer = document.getElementById('cinema-container');

        let dpr = window.devicePixelRatio || 1;
        let canvasWidth, canvasHeight;

        function resizeCanvas() {
            const rect = cinemaContainer.getBoundingClientRect();
            canvasWidth = rect.width;
            canvasHeight = rect.height;
            canvas.width = canvasWidth * dpr;
            canvas.height = canvasHeight * dpr;
            canvas.style.width = `${canvasWidth}px`;
            canvas.style.height = `${canvasHeight}px`;
            ctx.scale(dpr, dpr);
        }

        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // --- Easing function ---
        function easeOutCubic(t) {
            return (--t) * t * t + 1;
        }

        // --- Visual Entity Classes ---
        class Person {
            constructor(x, y, scale = 1, type = 'adult') {
                this.x = x;
                this.y = y;
                this.targetX = x;
                this.targetY = y;
                this.scale = scale;
                this.opacity = 0;
                this.targetOpacity = 0;
                this.type = type;
                this.visible = false;
            }

            draw(ctx) {
                if (!this.visible || this.opacity === 0) return;
                ctx.save();
                ctx.globalAlpha = this.opacity;
                ctx.translate(this.x, this.y);
                ctx.scale(this.scale, this.scale);
                
                const headRadius = this.type === 'adult' ? 15 : 12;
                const bodyHeight = this.type === 'adult' ? 30 : 25;
                const bodyWidth = this.type === 'adult' ? 35 : 28;
                
                // Body
                ctx.fillStyle = this.type === 'adult' ? '#6c91c3' : '#e58c82';
                ctx.beginPath();
                ctx.moveTo(-bodyWidth / 2, headRadius + bodyHeight);
                ctx.lineTo(bodyWidth / 2, headRadius + bodyHeight);
                ctx.lineTo(0, headRadius);
                ctx.closePath();
                ctx.fill();

                // Head
                ctx.fillStyle = '#ffc8a6';
                ctx.beginPath();
                ctx.arc(0, 0, headRadius, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }

            update(dt) {
                const rate = 0.05 * (dt/16.67);
                this.x += (this.targetX - this.x) * rate;
                this.y += (this.targetY - this.y) * rate;
                this.opacity += (this.targetOpacity - this.opacity) * rate;
                if (Math.abs(this.targetOpacity - this.opacity) < 0.01) this.opacity = this.targetOpacity;
            }
        }

        class Ticket {
            constructor(x, y, type = 'adult', price = 5) {
                this.x = x;
                this.y = y;
                this.targetX = x;
                this.targetY = y;
                this.opacity = 0;
                this.targetOpacity = 0;
                this.scale = 1;
                this.targetScale = 1;
                this.type = type;
                this.price = price;
                this.visible = false;
                this.width = 40;
                this.height = 60;
                this.color = type === 'adult' ? '#ff8c82' : '#ffd761';
            }

            draw(ctx) {
                if (!this.visible || this.opacity === 0) return;
                ctx.save();
                ctx.globalAlpha = this.opacity;
                ctx.translate(this.x, this.y);
                ctx.scale(this.scale, this.scale);

                ctx.fillStyle = this.color;
                ctx.strokeStyle = 'rgba(0,0,0,0.3)';
                ctx.lineWidth = 2;

                ctx.beginPath();
                ctx.moveTo(-this.width / 2, -this.height / 2);
                ctx.lineTo(this.width / 2, -this.height / 2);
                ctx.lineTo(this.width / 2, this.height / 2);
                ctx.lineTo(-this.width / 2, this.height / 2);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(0, -this.height/4, 5, 0, Math.PI, true);
                ctx.stroke();
                 ctx.beginPath();
                ctx.arc(0, this.height/4, 5, 0, Math.PI, true);
                ctx.stroke();


                ctx.fillStyle = '#000';
                ctx.font = 'bold 18px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(`¥${this.price}`, 0, 0);

                ctx.restore();
            }
            update(dt) {
                const rate = 0.07 * (dt/16.67);
                this.x += (this.targetX - this.x) * rate;
                this.y += (this.targetY - this.y) * rate;
                this.opacity += (this.targetOpacity - this.opacity) * rate;
                this.scale += (this.targetScale - this.scale) * rate;
                 if (Math.abs(this.targetOpacity - this.opacity) < 0.01) this.opacity = this.targetOpacity;
            }
        }
        
        class PlusSign {
            constructor(x,y){
                this.x = x;
                this.y = y;
                this.opacity = 0;
                this.targetOpacity = 0;
                this.visible = false;
            }
            draw(ctx) {
                if (!this.visible || this.opacity === 0) return;
                ctx.save();
                ctx.globalAlpha = this.opacity;
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 4;
                ctx.lineCap = 'round';
                
                ctx.beginPath();
                ctx.moveTo(this.x - 15, this.y);
                ctx.lineTo(this.x + 15, this.y);
                ctx.moveTo(this.x, this.y - 15);
                ctx.lineTo(this.x, this.y + 15);
                ctx.stroke();
                
                ctx.restore();
            }
             update(dt) {
                const rate = 0.07 * (dt/16.67);
                this.opacity += (this.targetOpacity - this.opacity) * rate;
            }
        }


        // --- Script & Timeline ---
        const script = [
            { t: 500, cn: "爸爸妈妈带着澎澎去公园玩，我们来算算买门票一共要花多少钱。", action: "intro" },
            { t: 5500, cn: "第一步，我们先算爸爸妈妈的成人票需要多少钱。", action: "step1_intro" },
            { t: 9000, cn: "一张成人票5元，两张就是5元加5元，一共是10元。", action: "step1_calc" },
            { t: 14000, cn: "第二步，我们再算澎澎的学生票需要多少钱。", action: "step2_intro" },
            { t: 17500, cn: "学生票每张3元，所以澎澎的票就是3元。", action: "step2_calc" },
            { t: 21000, cn: "最后，把成人票的10元和学生票的3元加起来。", action: "step3_intro" },
            { t: 25000, cn: "10元加上3元，总共是13元。", action: "step3_calc" },
            { t: 28500, cn: "所以，澎澎一家买门票共要花13元。", action: "conclusion" },
        ];

        const totalDuration = script[script.length - 1].t + 3000;

        let startTime = null;
        let lastTimestamp = 0;
        let currentStepIndex = -1;

        const people = [
            new Person(0, 0, 1, 'adult'), // Dad
            new Person(0, 0, 1, 'adult'), // Mom
            new Person(0, 0, 0.9, 'child') // Pengpeng
        ];
        const tickets = [
            new Ticket(0,0,'adult',5), new Ticket(0,0,'adult',5), // Adult tickets
            new Ticket(0,0,'child',3) // Child ticket
        ];
        const plusSign = new PlusSign(0,0);
        const allEntities = [...people, ...tickets, plusSign];


        function executeAction(action) {
            hideMathCard();
            const centerX = canvasWidth / 2;
            const centerY = canvasHeight / 2;

            switch (action) {
                case 'intro':
                    header.classList.add('visible');
                    people[0].targetX = centerX - 100;
                    people[0].targetY = centerY - 50;
                    people[1].targetX = centerX + 100;
                    people[1].targetY = centerY - 50;
                    people[2].targetX = centerX;
                    people[2].targetY = centerY - 30;
                    [people[0], people[1], people[2]].forEach(p => { p.visible = true; p.targetOpacity = 1; });
                    break;
                
                case 'step1_intro':
                    [people[0], people[1]].forEach(p => p.scale = 1.1); // Highlight adults
                    people[2].targetOpacity = 0.3;
                    break;

                case 'step1_calc':
                    people[2].targetOpacity = 0;
                    tickets[0].visible = true;
                    tickets[1].visible = true;
                    tickets[0].targetX = people[0].x;
                    tickets[0].targetY = people[0].y + 100;
                    tickets[1].targetX = people[1].x;
                    tickets[1].targetY = people[1].y + 100;
                    [tickets[0], tickets[1]].forEach(t => t.targetOpacity = 1);

                    setTimeout(() => {
                        const adultTicketsX = centerX - 120;
                        const adultTicketsY = centerY + 80;
                        tickets[0].targetX = adultTicketsX;
                        tickets[0].targetY = adultTicketsY;
                        tickets[1].targetX = adultTicketsX + 50;
                        tickets[1].targetY = adultTicketsY;
                        [people[0],people[1]].forEach(p=>p.targetOpacity=0);
                        
                        showMathCard("5 + 5 = 10 (元)", "成人票总价");
                    }, 2500);
                    break;

                case 'step2_intro':
                    [people[0], people[1]].forEach(p => p.visible = false);
                    people[2].targetX = centerX;
                    people[2].targetY = centerY - 50;
                    people[2].targetOpacity = 1;
                    people[2].scale = 1;

                    [tickets[0], tickets[1]].forEach(t => { t.targetOpacity = 0.3; t.targetScale=0.8 });
                    break;

                case 'step2_calc':
                    tickets[2].visible = true;
                    tickets[2].targetX = people[2].x;
                    tickets[2].targetY = people[2].y + 90;
                    tickets[2].targetOpacity = 1;

                     setTimeout(() => {
                        const childTicketX = centerX + 120;
                        const childTicketY = centerY + 80;
                        tickets[2].targetX = childTicketX;
                        tickets[2].targetY = childTicketY;
                        people[2].targetOpacity = 0;
                        showMathCard("3 (元)", "学生票价");
                    }, 2500);
                    break;
                
                case 'step3_intro':
                    people[2].visible = false;
                    [tickets[0], tickets[1]].forEach(t => { t.targetOpacity = 1; t.targetScale=1; });
                    
                    plusSign.visible = true;
                    plusSign.x = centerX;
                    plusSign.y = centerY + 80;
                    plusSign.targetOpacity = 1;
                    break;

                case 'step3_calc':
                    const finalX = centerX;
                    const finalY = centerY + 20;
                    tickets[0].targetX = finalX - 25;
                    tickets[0].targetY = finalY;
                    tickets[1].targetX = finalX + 25;
                    tickets[1].targetY = finalY;
                    tickets[2].targetX = finalX;
                    tickets[2].targetY = finalY;
                    
                    plusSign.targetOpacity = 0;
                    
                    setTimeout(() => {
                        showMathCard("10 + 3 = 13 (元)", "门票总费用");
                    }, 2000);
                    break;
                
                case 'conclusion':
                    allEntities.forEach(e => e.targetOpacity = 0);
                    setTimeout(() => {
                         showMathCard("13 元", "总共花费");
                    }, 1000);
                    break;
            }
        }
        
        // --- UI Control ---
        function showMathCard(content, label) {
            mathContent.textContent = content;
            mathLabel.textContent = label;
            mathCard.classList.add('visible');
        }

        function hideMathCard() {
            mathCard.classList.remove('visible');
        }

        function updateSubtitle(text) {
            if (text) {
                subCN.textContent = text;
                subtitleBox.classList.add('visible');
                subtitleBox.style.transform = 'translateX(-50%) scale(1.05)';
                setTimeout(() => {
                   subtitleBox.style.transform = 'translateX(-50%) scale(1)';
                }, 100);
                 speakText(text);
            } else {
                subtitleBox.classList.remove('visible');
            }
        }
        
        // --- Speech Synthesis ---
        function speakText(text) {
            if (typeof window === 'undefined' || !('speechSynthesis' in window)) return;
            const synth = window.speechSynthesis;
            synth.cancel();
            if (!text || !text.trim()) return;
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'zh-CN';
            utter.rate = 1.0;
            utter.pitch = 1.0;
            synth.speak(utter);
        }

        // --- Main Loop ---
        function loop(timestamp) {
            if (!startTime) {
                startTime = timestamp;
                lastTimestamp = timestamp;
            }
            const elapsed = timestamp - startTime;
            const dt = timestamp - lastTimestamp;
            lastTimestamp = timestamp;

            // --- Update script ---
            const nextStepIndex = script.findIndex(step => step.t > elapsed);
            const newStepIndex = (nextStepIndex === -1 ? script.length : nextStepIndex) - 1;

            if (newStepIndex > currentStepIndex) {
                for (let i = currentStepIndex + 1; i <= newStepIndex; i++) {
                    updateSubtitle(script[i].cn);
                    executeAction(script[i].action);
                }
                currentStepIndex = newStepIndex;
            }

            // --- Update progress bar ---
            const progress = Math.min(elapsed / totalDuration, 1);
            progressBar.style.width = `${progress * 100}%`;

            // --- Clear and draw ---
            ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);

            allEntities.forEach(entity => {
                entity.update(dt);
                entity.draw(ctx);
            });

            if (elapsed < totalDuration) {
                requestAnimationFrame(loop);
            } else {
                 updateSubtitle(""); // Hide subtitle at the end
            }
        }
        
        // Start animation after a short delay to ensure assets are ready
        setTimeout(() => {
             requestAnimationFrame(loop);
        }, 100);

    </script>
</body>
</html>
