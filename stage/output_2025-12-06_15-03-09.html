<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>方阵问题：体操队有多少人？</title>
    <style>
        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Microsoft Yahei", "Noto Sans SC", sans-serif;
        }
        #cinema-container {
            width: 90vw;
            max-width: 1280px;
            aspect-ratio: 16 / 9;
            background-color: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
        }
        #canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        .overlay-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            position: absolute;
            top: 4%;
            left: 5%;
            right: 5%;
            text-align: left;
            opacity: 0;
            transform: translateY(-20px);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }
        .header.visible {
            opacity: 1;
            transform: translateY(0);
        }
        .title {
            font-size: 2.2vw;
            color: #333;
            margin: 0;
        }
        .subtitle-topic {
            font-size: 1.4vw;
            color: #666;
            margin-top: 5px;
        }
        .math-card {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background-color: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(0, 0, 0, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 2vw 3vw;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            opacity: 0;
            transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: all;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .math-card.visible {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
        .math-text {
            font-size: 2.5vw;
            font-weight: bold;
            color: #2c3e50;
        }
        .math-sub {
            font-size: 1.2vw;
            color: #7f8c8d;
            margin-top: 10px;
        }
        .subtitle-box {
            position: absolute;
            bottom: 5%;
            width: 80%;
            max-width: 900px;
            background-color: rgba(25, 25, 25, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 15px 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .subtitle-box.visible {
            opacity: 1;
            transform: translateY(0);
        }
        .subtitle-cn {
            color: #fff;
            font-size: 1.6vw;
            text-align: center;
            display: block;
            letter-spacing: 0.1em;
        }
        .progress-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background-color: rgba(0, 0, 0, 0.1);
        }
        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #5EE2A0, #46A3FF);
            border-radius: 0 3px 3px 0;
        }
    </style>
</head>
<body>
    <div id="cinema-container">
        <canvas id="canvas"></canvas>
        <div class="overlay-layer">
            <div class="header" id="header">
                <h1 class="title">方阵问题：体操队有多少人？</h1>
                <span class="subtitle-topic">根据每排人数、方阵和领队计算总人数</span>
            </div>
            <div class="math-card" id="mathCard">
                <div class="math-text" id="mathContent"></div>
                <div class="math-sub" id="mathLabel"></div>
            </div>
            <div class="subtitle-box" id="subtitleBox">
                <span class="subtitle-cn" id="subCN"></span>
            </div>
        </div>
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
    </div>

    <script>
        // --- 基本设置 ---
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const header = document.getElementById('header');
        const subtitleBox = document.getElementById('subtitleBox');
        const subCN = document.getElementById('subCN');
        const mathCard = document.getElementById('mathCard');
        const mathContent = document.getElementById('mathContent');
        const mathLabel = document.getElementById('mathLabel');
        const progressBar = document.getElementById('progressBar');
        const container = document.getElementById('cinema-container');

        let width, height, dpr;
        
        function resizeCanvas() {
            const rect = container.getBoundingClientRect();
            dpr = window.devicePixelRatio || 1;
            width = rect.width;
            height = rect.height;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            canvas.style.width = `${width}px`;
            canvas.style.height = `${height}px`;
            ctx.scale(dpr, dpr);
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // --- 语音朗读 ---
        function speakText(text) {
            if (typeof window === 'undefined' || !('speechSynthesis' in window)) return;
            const synth = window.speechSynthesis;
            synth.cancel();
            if (!text || !text.trim()) return;
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'zh-CN';
            utter.rate = 1.0;
            utter.pitch = 1.0;
            synth.speak(utter);
        }
        
        // --- 动画实体 ---
        const PERSON_COLOR = '#3498db';
        const LEADER_COLOR = '#e67e22';
        const HIGHLIGHT_COLOR = 'rgba(241, 196, 15, 0.8)';

        class Person {
            constructor(x, y, color = PERSON_COLOR, type = 'squad') {
                this.x = x;
                this.y = y;
                this.targetX = x;
                this.targetY = y;
                this.radius = 12;
                this.color = color;
                this.type = type;
                this.opacity = 0;
                this.targetOpacity = 0;
                this.scale = 0;
                this.targetScale = 0;
                this.visible = false;
                this.isHighlighted = false;
            }

            appear() {
                this.visible = true;
                this.targetOpacity = 1;
                this.targetScale = 1;
            }
            
            disappear() {
                this.targetOpacity = 0;
                this.targetScale = 0;
            }

            update(deltaTime) {
                if (!this.visible) return;
                const lerpFactor = 1 - Math.pow(0.01, deltaTime);
                this.opacity += (this.targetOpacity - this.opacity) * lerpFactor;
                this.scale += (this.targetScale - this.scale) * lerpFactor;
                this.x += (this.targetX - this.x) * lerpFactor;
                this.y += (this.targetY - this.y) * lerpFactor;

                if (Math.abs(this.targetOpacity - this.opacity) < 0.01) this.opacity = this.targetOpacity;
                if (Math.abs(this.targetScale - this.scale) < 0.01) this.scale = this.targetScale;
                if (this.opacity < 0.01 && this.targetOpacity === 0) this.visible = false;
            }

            draw(ctx) {
                if (!this.visible || this.opacity <= 0 || this.scale <= 0) return;
                ctx.save();
                ctx.globalAlpha = this.opacity;
                ctx.translate(this.x, this.y);
                ctx.scale(this.scale, this.scale);

                if (this.isHighlighted) {
                    ctx.fillStyle = HIGHLIGHT_COLOR;
                    ctx.beginPath();
                    ctx.arc(0, 0, this.radius * 1.5, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(0, -this.radius * 0.4, this.radius * 0.6, 0, Math.PI * 2); // Head
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(-this.radius * 0.8, this.radius * 0.9);
                ctx.lineTo(0, 0);
                ctx.lineTo(this.radius * 0.8, this.radius * 0.9);
                ctx.lineTo(-this.radius * 0.8, this.radius * 0.9);
                ctx.fill(); // Body

                ctx.restore();
            }
        }
        
        // --- 场景管理 ---
        let people = [];
        let leaders = [];
        let lastTime = 0;

        function setupScene() {
            people = [];
            leaders = [];
            const rows = 6;
            const cols = 6;
            const spacing = 50;
            const startX = width / 2 - (cols - 1) * spacing / 2;
            const startY = height / 2 - (rows - 1) * spacing / 2 - 20;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const person = new Person(startX + c * spacing, startY + r * spacing);
                    people.push(person);
                }
            }
            
            const leaderStartX = width / 2 - 25;
            const leaderY = startY - 80;
            for (let i = 0; i < 2; i++) {
                const leader = new Person(leaderStartX + i * 50, leaderY, LEADER_COLOR, 'leader');
                leaders.push(leader);
            }
        }

        // --- 动画脚本 ---
        const script = [
            { t: 500, cn: "题目说，同学们排成了一个正方形队伍。", action: "showTitle" },
            { t: 3500, cn: "队伍每排有 6 个人。", action: "showSquad_1" },
            { t: 6000, cn: "因为是正方形队伍，所以一共有 6 排。", action: "showSquad_full" },
            { t: 9000, cn: "我们可以用乘法计算出方阵里一共有多少人。", action: "prepareCalcSquad" },
            { t: 12000, cn: "6 乘以 6 等于 36。", action: "showCalcSquad" },
            { t: 15000, cn: "所以，体操方阵里有 36 名同学。", action: "squadConclusion" },
            { t: 18000, cn: "题目还说，每个方阵前面要有 2 名领队。", action: "showLeaders" },
            { t: 21500, cn: "现在，我们来计算参加比赛的总人数。", action: "prepareCalcTotal" },
            { t: 24500, cn: "把方阵的 36 人，加上领队的 2 人...", action: "showCalcTotal" },
            { t: 28000, cn: "...等于 38 人。", action: "showResult" },
            { t: 31000, cn: "所以，一（1）班参加比赛的一共有 38 人。", action: "finalConclusion" },
        ];
        
        const totalDuration = script[script.length - 1].t + 3000;
        let currentStepIndex = -1;
        let startTime = null;

        function executeAction(action) {
            mathCard.classList.remove('visible');

            switch (action) {
                case 'showTitle':
                    header.classList.add('visible');
                    break;
                case 'showSquad_1':
                    people.slice(0, 6).forEach((p, i) => {
                        setTimeout(() => p.appear(), i * 80);
                    });
                    break;
                case 'showSquad_full':
                    people.forEach((p, i) => {
                        if (i >= 6) {
                            setTimeout(() => p.appear(), (i - 6) * 30);
                        }
                    });
                    break;
                case 'prepareCalcSquad':
                    people.forEach(p => p.isHighlighted = false);
                    break;
                case 'showCalcSquad':
                    mathContent.textContent = '6 × 6 = 36';
                    mathLabel.textContent = '方阵人数 = 每排人数 × 排数';
                    mathCard.classList.add('visible');
                    people.forEach(p => p.isHighlighted = true);
                    break;
                case 'squadConclusion':
                    people.forEach(p => p.isHighlighted = false);
                    break;
                case 'showLeaders':
                    leaders.forEach((l, i) => {
                        setTimeout(() => l.appear(), i * 100);
                    });
                    break;
                case 'prepareCalcTotal':
                    people.forEach(p => p.isHighlighted = true);
                    leaders.forEach(l => l.isHighlighted = true);
                    break;
                case 'showCalcTotal':
                    mathContent.textContent = '36 + 2 = ?';
                    mathLabel.textContent = '总人数 = 方阵人数 + 领队人数';
                    mathCard.classList.add('visible');
                    break;
                case 'showResult':
                    mathContent.textContent = '36 + 2 = 38';
                    mathLabel.textContent = '总人数 = 方阵人数 + 领队人数';
                    mathCard.classList.add('visible');
                    break;
                case 'finalConclusion':
                    break;
            }
        }
        
        function loop(timestamp) {
            if (!startTime) startTime = timestamp;
            const elapsed = timestamp - startTime;
            const deltaTime = (timestamp - lastTime) / 1000;
            lastTime = timestamp;

            // --- 更新脚本 ---
            const nextStepIndex = script.findIndex(step => step.t > elapsed);
            const newStepIndex = (nextStepIndex === -1) ? script.length - 1 : nextStepIndex - 1;

            if (newStepIndex > currentStepIndex) {
                for (let i = currentStepIndex + 1; i <= newStepIndex; i++) {
                    const step = script[i];
                    subCN.textContent = step.cn;
                    subtitleBox.classList.remove('visible');
                    // Force reflow
                    void subtitleBox.offsetWidth;
                    subtitleBox.classList.add('visible');
                    speakText(step.cn);
                    executeAction(step.action);
                }
                currentStepIndex = newStepIndex;
            }

            // --- 更新与绘制 ---
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.scale(dpr, dpr);

            [...people, ...leaders].forEach(p => {
                p.update(deltaTime);
                p.draw(ctx);
            });

            ctx.restore();
            
            // --- 更新进度条 ---
            const progress = Math.min(elapsed / totalDuration, 1);
            progressBar.style.width = `${progress * 100}%`;

            if (elapsed < totalDuration) {
                requestAnimationFrame(loop);
            }
        }

        setupScene();
        requestAnimationFrame(loop);

    </script>
</body>
</html>
