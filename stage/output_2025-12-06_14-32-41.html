<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>方阵问题动画</title>
  <style>
    :root {
      --bg-color: #f0f8ff;
      --text-color: #333;
      --title-color: #005a9c;
      --subtitle-color: #555;
      --bar-bg: #e0e0e0;
      --bar-fill: #4CAF50;
      --card-bg: rgba(255, 255, 255, 0.9);
      --subtitle-bg: rgba(0, 0, 0, 0.65);
      --subtitle-text-color: #fff;
      --item-color: #3498db;
      --leader-color: #e74c3c;
      --highlight-color: #f39c12;
    }

    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: var(--bg-color);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Microsoft Yahei", "Noto Sans SC", sans-serif;
    }

    #cinema-container {
      width: 90vw;
      max-width: 1280px;
      aspect-ratio: 16 / 9;
      background-color: #fff;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      position: relative;
      overflow: hidden;
    }

    #canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .overlay-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .header {
      position: absolute;
      top: 4%;
      left: 4%;
      opacity: 0;
      transition: opacity 0.5s ease-in-out;
    }

    .header.visible {
      opacity: 1;
    }

    .title {
      font-size: 2.2vw;
      color: var(--title-color);
      margin: 0;
    }

    .subtitle-topic {
      font-size: 1.2vw;
      color: var(--subtitle-color);
    }

    .math-card {
      position: absolute;
      top: 25%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.9);
      padding: 1.5vw 2.5vw;
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      text-align: center;
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    
    .math-card.visible {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
    }

    .math-text {
      font-size: 2.5vw;
      font-weight: bold;
      color: var(--text-color);
    }

    .math-sub {
      font-size: 1.2vw;
      color: var(--subtitle-color);
      margin-top: 0.5vw;
    }

    .subtitle-box {
      position: absolute;
      bottom: 5%;
      left: 50%;
      transform: translateX(-50%);
      width: 80%;
      max-width: 900px;
      padding: 1vw 2vw;
      background: var(--subtitle-bg);
      backdrop-filter: blur(8px);
      border-radius: 20px;
      text-align: center;
      opacity: 0;
    }

    .subtitle-box.pulse {
      animation: pulse-effect 0.5s ease-out;
    }

    @keyframes pulse-effect {
      0% { opacity: 0; transform: translateX(-50%) scale(0.95); }
      50% { opacity: 1; }
      100% { transform: translateX(-50%) scale(1); }
    }
    
    .subtitle-cn {
      font-size: 1.8vw;
      color: var(--subtitle-text-color);
      letter-spacing: 0.05em;
      line-height: 1.5;
    }

    .progress-container {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 5px;
      background-color: var(--bar-bg);
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background-color: var(--bar-fill);
      transition: width 0.1s linear;
    }
  </style>
</head>

<body>
  <div id="cinema-container">
    <canvas id="canvas"></canvas>
    <div class="overlay-layer">
      <div class="header" id="header">
        <h1 class="title">体操方阵问题</h1>
        <span class="subtitle-topic">一(1)班参加比赛的同学人数计算</span>
      </div>

      <div class="math-card" id="mathCard">
        <div class="math-text" id="mathContent"></div>
        <div class="math-sub" id="mathLabel"></div>
      </div>

      <div class="subtitle-box" id="subtitleBox">
        <span class="subtitle-cn" id="subCN"></span>
      </div>
    </div>
    <div class="progress-container">
      <div class="progress-bar" id="progressBar"></div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const subtitleBox = document.getElementById('subtitleBox');
    const subCN = document.getElementById('subCN');
    const mathCard = document.getElementById('mathCard');
    const mathContent = document.getElementById('mathContent');
    const mathLabel = document.getElementById('mathLabel');
    const progressBar = document.getElementById('progressBar');
    const header = document.getElementById('header');

    const dpr = window.devicePixelRatio || 1;
    const container = document.getElementById('cinema-container');
    let canvasWidth, canvasHeight;
    
    const items = [];

    // --- 教具实体类 ---
    class Item {
      constructor(x, y, radius, color) {
        this.x = x;
        this.y = y;
        this.targetX = x;
        this.targetY = y;
        this.radius = radius;
        this.targetRadius = radius;
        this.color = color;
        this.targetColor = color;
        this.opacity = 0;
        this.targetOpacity = 0;
        this.visible = false;
      }

      update(delta) {
        const easing = 0.08;
        this.x += (this.targetX - this.x) * easing;
        this.y += (this.targetY - this.y) * easing;
        this.opacity += (this.targetOpacity - this.opacity) * easing;
        this.radius += (this.targetRadius - this.radius) * easing;
      }

      draw(ctx) {
        if (!this.visible || this.opacity < 0.01) return;
        ctx.save();
        ctx.globalAlpha = this.opacity;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    // --- 动画脚本 ---
    const script = [
      { t: 500,  cn: "我们来看一个关于排队的问题。", action: "intro_scene" },
      { t: 3500, cn: "题目说，同学们排成一个正方形的队伍。", action: "noop" },
      { t: 6500, cn: "并且，每排有 6 个人。", action: "form_first_row" },
      { t: 9000, cn: "因为是正方形队伍，所以排数和每排的人数一样，也是 6 排。", action: "form_square" },
      { t: 13000, cn: "那么，这个方阵里一共有多少人呢？我们可以用乘法计算。", action: "show_step1_calc" },
      { t: 17000, cn: "6 乘以 6 等于 36。所以方阵里有 36 名同学。", action: "solve_step1" },
      { t: 21000, cn: "别忘了，题目还说，每个方阵前面还有 2 名领队的同学。", action: "show_leaders" },
      { t: 25000, cn: "我们在方阵人数的基础上，再加上这 2 名领队。", action: "show_step2_calc" },
      { t: 29000, cn: "36 加上 2 等于 38。", action: "solve_step2" },
      { t: 32000, cn: "所以，一（1）班参加比赛的一共有 38 人。", action: "conclusion" },
    ];
    
    // --- 语音朗读 ---
    function speakText(text) {
      if (typeof window === 'undefined' || !('speechSynthesis' in window)) return;
      const synth = window.speechSynthesis;
      synth.cancel();
      if (!text || !text.trim()) return;
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'zh-CN';
      utter.rate = 1.0;
      utter.pitch = 1.0;
      synth.speak(utter);
    }

    // --- 初始化与尺寸调整 ---
    function setupCanvas() {
      const rect = container.getBoundingClientRect();
      canvasWidth = rect.width;
      canvasHeight = rect.height;
      canvas.width = canvasWidth * dpr;
      canvas.height = canvasHeight * dpr;
      canvas.style.width = `${canvasWidth}px`;
      canvas.style.height = `${canvasHeight}px`;
      ctx.scale(dpr, dpr);
    }

    // --- 场景设置 ---
    function createItems() {
        // Create 36 team members + 2 leaders
        for (let i = 0; i < 38; i++) {
            const isLeader = i >= 36;
            const item = new Item(
                canvasWidth / 2,
                canvasHeight * 0.1,
                canvasHeight * 0.04,
                isLeader ? 'var(--leader-color)' : 'var(--item-color)'
            );
            items.push(item);
        }
    }

    function resetAllItems() {
        items.forEach(item => {
            item.targetX = canvasWidth / 2;
            item.targetY = canvasHeight * 0.1;
            item.targetOpacity = 0;
            item.visible = false;
        });
    }

    // --- 动作执行 ---
    function executeAction(action) {
      switch (action) {
        case 'intro_scene':
          header.classList.add('visible');
          resetAllItems();
          break;

        case 'form_first_row':
          const spacing = canvasWidth * 0.08;
          const startX = canvasWidth / 2 - (5 * spacing) / 2;
          const yPos = canvasHeight * 0.45;
          for (let i = 0; i < 6; i++) {
              const item = items[i];
              item.visible = true;
              item.targetOpacity = 1;
              item.targetX = startX + i * spacing;
              item.targetY = yPos;
          }
          break;

        case 'form_square':
          const spacingSq = canvasWidth * 0.08;
          const startXSq = canvasWidth / 2 - (5 * spacingSq) / 2;
          const startYSq = canvasHeight / 2 - (5 * spacingSq) / 2;
          for (let row = 0; row < 6; row++) {
              for (let col = 0; col < 6; col++) {
                  const index = row * 6 + col;
                  const item = items[index];
                  item.visible = true;
                  item.targetOpacity = 1;
                  item.targetX = startXSq + col * spacingSq;
                  item.targetY = startYSq + row * spacingSq;
              }
          }
          break;

        case 'show_step1_calc':
          mathContent.innerHTML = `6 × 6 = ?`;
          mathLabel.textContent = "方阵人数 = 每排人数 × 排数";
          mathCard.classList.add('visible');
          break;

        case 'solve_step1':
          mathContent.innerHTML = `6 × 6 = 36`;
          mathLabel.textContent = "方阵里有 36 名同学";
          break;
        
        case 'show_leaders':
          mathCard.classList.remove('visible');
          const squadCenterX = canvasWidth / 2;
          const squadFrontY = canvasHeight / 2 - (5 * canvasWidth * 0.08) / 2 - canvasWidth * 0.1;
          const leaderSpacing = canvasWidth * 0.1;
          const leader1 = items[36];
          const leader2 = items[37];
          
          leader1.visible = true;
          leader1.targetOpacity = 1;
          leader1.targetX = squadCenterX - leaderSpacing / 2;
          leader1.targetY = squadFrontY;
          
          leader2.visible = true;
          leader2.targetOpacity = 1;
          leader2.targetX = squadCenterX + leaderSpacing / 2;
          leader2.targetY = squadFrontY;
          break;
        
        case 'show_step2_calc':
          mathContent.innerHTML = `36 + 2 = ?`;
          mathLabel.textContent = "总人数 = 方阵人数 + 领队人数";
          mathCard.classList.add('visible');
          break;
          
        case 'solve_step2':
          mathContent.innerHTML = `36 + 2 = 38`;
          mathLabel.textContent = "加上领队后共有 38 人";
          items.forEach(item => item.color = item.targetColor); // Reset color
          break;

        case 'conclusion':
          mathContent.innerHTML = `总人数 = 38人`;
          mathLabel.textContent = "一(1)班参加比赛的总人数";
          items.forEach(item => {
              item.color = 'var(--highlight-color)';
          });
          break;
        
        case 'noop':
            // Do nothing
            break;
      }
    }

    // --- 主循环 ---
    let startTime = null;
    let lastTime = null;
    let currentStepIndex = -1;
    const totalDuration = script[script.length - 1].t + 2000;

    function loop(timestamp) {
      if (!startTime) {
        startTime = timestamp;
        lastTime = timestamp;
      }
      const elapsed = timestamp - startTime;
      const delta = timestamp - lastTime;
      lastTime = timestamp;

      // 触发脚本
      while (
        currentStepIndex + 1 < script.length &&
        script[currentStepIndex + 1].t <= elapsed
      ) {
        currentStepIndex++;
        const step = script[currentStepIndex];
        subCN.textContent = step.cn || '';
        subtitleBox.classList.remove('pulse');
        void subtitleBox.offsetWidth; // Trigger reflow
        subtitleBox.classList.add('pulse');
        speakText(step.cn || '');
        executeAction(step.action);
      }

      // 更新与绘制
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      items.forEach(item => item.update(delta));
      items.forEach(item => item.draw(ctx));

      // 更新进度条
      const progress = Math.min(elapsed / totalDuration, 1);
      progressBar.style.width = (progress * 100).toFixed(2) + '%';

      if (elapsed < totalDuration) {
        window.requestAnimationFrame(loop);
      }
    }

    // --- 启动 ---
    window.addEventListener('load', () => {
      setupCanvas();
      createItems();
      window.requestAnimationFrame(loop);
    });

    window.addEventListener('resize', setupCanvas);

  </script>
</body>

</html>
